  <style>
    /* ===== Napperon argenté ===== */
    .napperon {
      position: relative;
      width: min(92vw, 470px);
      aspect-ratio: 600 / 760;
      container-type: inline-size;
      animation: napperon-float 9s ease-in-out infinite;
    }
    .napperon-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
    .napperon-content {
      position: absolute;
      left: 21%; right: 21%; top: 20%; bottom: 20%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center;
      color: #2b2540;
      text-shadow: 0 1px 0 rgba(255,255,255,.8), 0 -1px 0 rgba(0,0,0,.12);
    }
    .napperon-name {
      font-size: 10.5cqw; line-height: 1; text-wrap: balance;
      color: #24193f;
    }
    .napperon-rule {
      width: 55%; height: 1px; margin: 5cqw 0 4cqw;
      background: linear-gradient(90deg, transparent, rgba(60,55,80,.55), transparent);
      box-shadow: 0 1px 0 rgba(255,255,255,.7);
    }
    .napperon-row { display: block; margin-top: 3.4cqw; }
    .napperon-label {
      display: block; font-size: 2.3cqw; letter-spacing: .2em; text-transform: uppercase;
      color: #565b68; margin-bottom: .6cqw;
    }
    .napperon-link {
      display: inline-block; font-size: 3.3cqw; font-weight: 500; line-height: 1.3;
      color: #3b1d6e; overflow-wrap: anywhere;
      text-decoration: underline; text-decoration-color: rgba(59,29,110,.3); text-underline-offset: .22em;
      padding: .3em .5em; border-radius: .5em;
      transition: color .25s, text-decoration-color .25s, background-color .25s;
    }
    .napperon-link:hover, .napperon-link:focus-visible {
      color: #9d174d; text-decoration-color: currentColor; background: rgba(255,255,255,.45); outline: none;
    }
    .napperon-link:focus-visible { box-shadow: 0 0 0 2px #9d174d; }
    @keyframes napperon-float {
      0%, 100% { transform: translateY(0) rotate(-.4deg); }
      50% { transform: translateY(-8px) rotate(.4deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .napperon { animation: none; }
      .napperon .shine { display: none; }
    }
  </style>
